<!doctype html>
<html>
  <head>
    <title>Event Listener Example</title>
  </head>
  <body>
    <h1>JavaScript Event Listener</h1>
    <button id="clickButton">Click Me</button>
    <p id="message"></p>
    <input type="text" id="textInput" placeholder="Type something..." />
    <p id="inputDisplay"></p>
    <div
      id="hoverBox"
      style="
        width: 200px;
        height: 100px;
        background-color: lightblue;
        margin-top: 20px;
      "
    >
      Hover over this box
    </div>
    <script>
      document
        .getElementById("clickButton")
        .addEventListener("click", function () {
          6;
          document.getElementById("message").innerText = "Button clicked!";
        });
      document
        .getElementById("textInput")
        .addEventListener("input", function (event) {
          document.getElementById("inputDisplay").innerText =
            "You typed: " + event.target.value;
        });
      document
        .getElementById("hoverBox")
        .addEventListener("mouseover", function () {
          this.style.backgroundColor = "orange";
        });
      document
        .getElementById("hoverBox")
        .addEventListener("mouseout", function () {
          this.style.backgroundColor = "lightblue";
        });
    </script>
  </body>
</html>
